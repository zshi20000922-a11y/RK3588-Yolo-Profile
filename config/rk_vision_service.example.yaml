version: 1

service:
  results_socket: /run/rk-vision-service/results.sock
  control_socket: /run/rk-vision-service/control.sock
  log_dir: /userdata/rk-vision-service/logs
  stale_result_ms: 250
  rtsp_port: 8554

model:
  path: /userdata/rk-vision-service/models/yolov5s-640.rknn
  manifest: /userdata/rk-vision-service/models/yolov5s-640.yaml
  labels: /userdata/rk-vision-service/models/coco80.txt
  family: yolov5
  contexts: 2
  auto_select_cores: true
  confidence: 0.25
  nms_iou: 0.45
  max_detections: 100
  class_agnostic_nms: false
  class_filter: []

tracker:
  enabled: true
  high_threshold: 0.50
  low_threshold: 0.10
  match_iou: 0.30
  track_buffer: 30

motion:
  enabled: true
  width: 640
  height: 360
  pixel_threshold: 24
  min_region_pixels: 180
  active_ratio: 0.002
  global_change_ratio: 0.55
  gate_detection: false
  idle_detect_fps: 1

display:
  enabled: true
  backend: wayland
  width: 1920
  height: 1080
  fps: 30
  sources: [cam0, cam1]

sources:
  - id: cam0
    type: v4l2
    uri: /dev/video44
    enabled: true
    width: 3840
    height: 2160
    fps: 60
    buffers: 8
    detect_fps: 30
  - id: cam1
    type: v4l2
    uri: /dev/video62
    enabled: true
    width: 3840
    height: 2160
    fps: 60
    buffers: 8
    detect_fps: 30

outputs:
  - id: mosaic
    kind: mosaic
    codec: h264
    width: 1920
    height: 1080
    fps: 30
    bitrate: 8000000
    gop: 10
    udp_enabled: false
    udp_host: 127.0.0.1
    udp_port: 5600
    rtsp_enabled: true
    rtsp_path: /mosaic
